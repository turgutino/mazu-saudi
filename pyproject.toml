[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazu-saudi"
version = "0.1.0"
description = "Mechanism-constrained prediction of short-duration precipitation extremes"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.24",
  "pydantic>=2.9,<3",
  "torch>=2.0",
  "uvicorn>=0.30,<1",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "eccodes>=2.37",
  "h5py>=3.10",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mazu_saudi.competition" = ["web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "backend"]
